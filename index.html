<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Film Studio Tycoon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- STUDIO POPUP -->

  <div id="studioPopup" class="popup-overlay">

    <div class="popup">

      <h1>🎬 Create Your Studio</h1>

      <p>
        Every legendary film empire starts somewhere...
      </p>

      <input
        type="text"
        id="studioInput"
        placeholder="Studio Name"
      >

      <button onclick="createStudio()">
        Start Studio
      </button>

    </div>

  </div>

  <!-- MAIN GAME -->

  <div class="game-container">

    <h1 class="title">
      🎞️ Film Studio Tycoon
    </h1>

    <div class="top-bar">

      <div class="money-box">
        Budget: $<span id="money">30000</span>
      </div>

      <div class="studio-box">
        Studio: <span id="studioName">Unnamed Studio</span>
      </div>

    </div>

    <div class="section">

      <h2>Create Movie</h2>

      <input
        type="text"
        id="movieTitle"
        placeholder="Movie Title"
      >

      <h3>Choose Genre</h3>
      <div id="genreList" class="card-grid"></div>

      <h3>Choose Location</h3>
      <div id="locationList" class="card-grid"></div>

      <h3>Choose Actor</h3>
      <div id="actorList" class="card-grid"></div>

      <h3>Choose Trailer Type</h3>
      <div id="trailerList" class="card-grid"></div>

      <h3>Choose Marketing</h3>
      <div id="marketingList" class="card-grid"></div>

      <button class="release-btn" onclick="startFilming()">
        🎥 Begin Filming
      </button>

    </div>

    <div class="section hidden" id="filmingSection">

      <h2>🎬 Filming In Progress...</h2>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <p id="filmingText">
        Preparing set...
      </p>

    </div>

    <div class="section hidden" id="resultsSection">

      <h2>🍿 Premiere Results</h2>

      <div id="results"></div>

    </div>

  </div>

  <script src="game.js"></script>

</body>
</html>
